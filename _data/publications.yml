- title: "Online Batching with Lookahead: Adversarial Limits and Stochastic Gains"
  id: batching
  authors: "Dimitrios Christou, Jiayi Chen, Nihal Sharma, Aditya Akella, Shuchi Chawla, Sanjay Shakkottai"
  venue: "SIGMETRICS '27"
  venue_full: "ACM SIGMETRICS 2027"
  year: 2027
  type: conference
  note: "To appear"
  selected: true
  summary: "Characterizes when finite lookahead brings online batching close to the offline optimum: inherent limits under adversarial arrivals, but an optimality gap that shrinks exponentially with the lookahead window under Poisson arrivals."

- title: "UNUM: A New Framework for Network Control"
  id: unum
  authors: "Jiayi Chen, Nihal Sharma, Debajit Chakraborty, Saurabh Agarwal, Jeffrey Zhou, Aditya Akella, Sanjay Shakkottai"
  venue: "NSDI '26"
  venue_full: "23rd USENIX Symposium on Networked Systems Design and Implementation (NSDI 2026)"
  year: 2026
  type: conference
  selected: true
  links:
    - { name: "Paper", url: "/files/unum.pdf" }
    - { name: "Talk", url: "https://www.usenix.org/conference/nsdi26/presentation/chen-jiayi" }
    - { name: "Code", url: "https://github.com/ldos-project/UNUM" }
  summary: "Guided by the separation principle in control theory, UNUM exposes state estimation as a shared service: a learned network-state embedding that many controllers reuse. Improves congestion control and adaptive bitrate rewards by 13.6% and 45.5% on real-world traces."


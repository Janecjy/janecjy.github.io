- title: "How I Learned to Stop Worrying and Love Learned OS Policies"
  id: guardrails
  authors: "Divyanshu Saxena*, Jiayi Chen*, Sujay Yadalam, Yeonju Ro, Rohit Dwivedula, Eric H. Campbell, Aditya Akella, Christopher J. Rossbach, Michael Swift"
  venue: "HotOS '25"
  venue_full: "Workshop on Hot Topics in Operating Systems (HotOS 2025)"
  year: 2025
  type: conference
  note: "* Equal contribution"
  selected: true
  links:
    - { name: "Paper", url: "https://dl.acm.org/doi/10.1145/3713082.3730384" }
  summary: "Introduces Guardrails, a declarative abstraction that lets kernel developers specify system properties and corrective actions, compiled into in-kernel monitors that keep learned OS policies safe."

- title: "Darwin: Flexible Learning-based CDN Caching"
  id: darwin
  authors: "Jiayi Chen, Nihal Sharma, Tarannum Khan, Shu Liu, Brian Chang, Aditya Akella, Sanjay Shakkottai, Ramesh K. Sitaraman"
  venue: "SIGCOMM '23"
  venue_full: "ACM SIGCOMM 2023"
  year: 2023
  type: conference
  selected: true
  links:
    - { name: "Paper", url: "https://dl.acm.org/doi/10.1145/3603269.3604863" }
    - { name: "Talk", url: "https://www.youtube.com/watch?v=qVsUF5SglpU" }
    - { name: "Code", url: "https://github.com/Janecjy/Darwin" }
  summary: "Combines the adaptability of learning with the efficiency of heuristics: cross-expert predictors let observations of one deployed policy evaluate many alternatives, guiding a bandit with provable exploration cost. Up to 1.71x hit-rate improvement on Akamai production traces."

